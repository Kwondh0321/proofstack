name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-build:
    name: Quality build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      TURBO_FORCE: true
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local PostgreSQL definition
        run: docker compose config --quiet

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all static checks and builds
        run: pnpm check:static

      - name: Pack exact source build outputs
        id: pack
        run: |
          printf '%s\n' "$GITHUB_SHA" > quality-build-source-sha.txt
          node --version > quality-build-node-version.txt
          pnpm --version > quality-build-pnpm-version.txt
          printf 'quality-build-source-sha.txt\0quality-build-node-version.txt\0quality-build-pnpm-version.txt\0' > quality-build-paths.list
          find packages sdks services examples apps \
            -type d \( -name node_modules -o -name .next \) -prune -o \
            -type d -name dist -print0 -prune >> quality-build-paths.list
          tar --create --gzip --file=quality-check-build.tar.gz \
            --null --files-from=quality-build-paths.list
          sha256sum quality-check-build.tar.gz > quality-check-build.sha256
          read -r digest _ < quality-check-build.sha256
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload immutable quality build
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-build-${{ github.sha }}-${{ github.run_attempt }}
          path: quality-check-build.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  quality:
    name: Quality gates
    needs: quality-build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      TURBO_FORCE: true
    steps:
      - name: Require successful static preparation
        env:
          PREPARATION_RESULT: ${{ needs.quality-build.result }}
        run: test "$PREPARATION_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local PostgreSQL definition
        run: docker compose config --quiet

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --audit-level high --prod

      - name: Require exact quality build outputs
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.quality-build.outputs.artifact-id }}
          EXPECTED_BUILD_SHA256: ${{ needs.quality-build.outputs.sha256 }}
        run: |
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          [[ "$EXPECTED_BUILD_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Download exact quality build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.quality-build.outputs.artifact-id }}

      - name: Verify and restore exact source outputs
        env:
          EXPECTED_BUILD_SHA256: ${{ needs.quality-build.outputs.sha256 }}
        run: |
          [[ "$EXPECTED_BUILD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  quality-check-build.tar.gz\n' "$EXPECTED_BUILD_SHA256" | sha256sum --check --strict
          tar --extract --gzip --file=quality-check-build.tar.gz
          read -r source_sha < quality-build-source-sha.txt
          test "$source_sha" = "$GITHUB_SHA"
          node --version > quality-current-node-version.txt
          pnpm --version > quality-current-pnpm-version.txt
          cmp --silent quality-build-node-version.txt quality-current-node-version.txt
          cmp --silent quality-build-pnpm-version.txt quality-current-pnpm-version.txt

      - name: Run every package unit test
        run: pnpm check:test

  postgres-build:
    name: PostgreSQL integration build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PostgreSQL integration targets
        run: >-
          pnpm exec turbo run build --concurrency=3
          --filter=@proofstack/postgres^... --filter=@proofstack/api^... --filter=@proofstack/web^...
          --filter=@proofstack/example-durable-replay^...
          --filter=@proofstack/example-evaluation-control-flow^...
          --filter=@proofstack/example-model-assurance-control-flow^...
          --filter=@proofstack/example-workflow-1-acceptance^...

      - name: Pack exact source build outputs
        id: pack
        run: |
          printf '%s\n' "$GITHUB_SHA" > postgres-build-source-sha.txt
          printf 'postgres-build-source-sha.txt\0' > postgres-build-paths.list
          find packages sdks services examples apps \
            -type d \( -name node_modules -o -name .next \) -prune -o \
            -type d -name dist -print0 -prune >> postgres-build-paths.list
          tar --create --gzip --file=postgres-integration-build.tar.gz \
            --null --files-from=postgres-build-paths.list
          sha256sum postgres-integration-build.tar.gz > postgres-integration-build.sha256
          read -r digest _ < postgres-integration-build.sha256
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload immutable integration build
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-build-${{ github.sha }}-${{ github.run_attempt }}
          path: postgres-integration-build.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  postgres:
    name: PostgreSQL integration
    needs: postgres-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: proofstack_test
          POSTGRES_PASSWORD: proofstack_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proofstack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: proofstack-ci
      AWS_SECRET_ACCESS_KEY: proofstack-ci-secret
      CI: true
      PROOFSTACK_TEST_DATABASE_URL: postgresql://postgres:proofstack_test@127.0.0.1:5432/proofstack_test
      PROOFSTACK_TEST_S3_ACCESS_KEY_ID: proofstack-ci
      PROOFSTACK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      PROOFSTACK_TEST_S3_REGION: us-east-1
      PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY: proofstack-ci-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start pinned S3-compatible storage
        run: |
          docker run --detach --name proofstack-api-s3 \
            --env AWS_ACCESS_KEY_ID="$PROOFSTACK_TEST_S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY" \
            --publish 127.0.0.1:8333:8333 \
            chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b \
            mini -dir=/data -admin.ui=false -master.telemetry=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null "$PROOFSTACK_TEST_S3_ENDPOINT/"; then
              exit 0
            fi
            sleep 1
          done
          docker logs proofstack-api-s3
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require exact integration build outputs
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.postgres-build.outputs.artifact-id }}
          EXPECTED_BUILD_SHA256: ${{ needs.postgres-build.outputs.sha256 }}
        run: |
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          [[ "$EXPECTED_BUILD_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Download exact integration build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.postgres-build.outputs.artifact-id }}

      - name: Verify and restore exact source outputs
        env:
          EXPECTED_BUILD_SHA256: ${{ needs.postgres-build.outputs.sha256 }}
        run: |
          [[ "$EXPECTED_BUILD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  postgres-integration-build.tar.gz\n' "$EXPECTED_BUILD_SHA256" | sha256sum --check --strict
          tar --extract --gzip --file=postgres-integration-build.tar.gz
          read -r source_sha < postgres-build-source-sha.txt
          test "$source_sha" = "$GITHUB_SHA"

      # Keep all suites sharing the isolated database serial, with the original time limits.
      - name: Run PostgreSQL integration tests
        run: pnpm test:integration:postgres --only

  workflow-1:
    name: Workflow 1 clean-checkout acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated Workflow 1 acceptance
        run: pnpm test:acceptance:workflow-1

  workflow-2-candidate:
    name: Workflow 2 candidate clean-checkout acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated Workflow 2 candidate acceptance
        run: pnpm test:acceptance:workflow-2-candidate

  workflow-2-policy:
    name: Workflow 2 policy clean-checkout acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated Workflow 2 policy acceptance
        run: pnpm test:acceptance:workflow-2-policy

  workflow-2-policy-evaluation:
    name: Workflow 2 policy evaluation clean-checkout acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated authenticated policy evaluation acceptance
        run: pnpm test:acceptance:workflow-2-policy-evaluation

  policy-worker:
    name: Policy worker integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: proofstack_test
          POSTGRES_PASSWORD: proofstack_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proofstack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      PROOFSTACK_TEST_DATABASE_URL: postgresql://postgres:proofstack_test@127.0.0.1:5432/proofstack_test
      PROOFSTACK_TEST_S3_ACCESS_KEY_ID: proofstack-ci
      PROOFSTACK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      PROOFSTACK_TEST_S3_REGION: us-east-1
      PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY: proofstack-ci-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start pinned worker object storage
        run: |
          docker run --detach --name proofstack-policy-worker-s3 \
            --env AWS_ACCESS_KEY_ID="$PROOFSTACK_TEST_S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY" \
            --publish 127.0.0.1:8333:8333 \
            chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b \
            mini -dir=/data -admin.ui=false -master.telemetry=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null "$PROOFSTACK_TEST_S3_ENDPOINT/"; then
              exit 0
            fi
            sleep 1
          done
          docker logs proofstack-policy-worker-s3
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build worker dependencies
        run: pnpm exec turbo run build --filter=@proofstack/policy-worker... --concurrency=3

      - name: Run native worker and encrypted object integration
        run: pnpm --filter @proofstack/policy-worker test:integration

      - name: Report worker storage failure
        if: failure()
        run: docker logs proofstack-policy-worker-s3

      - name: Stop worker object storage
        if: always()
        run: docker stop proofstack-policy-worker-s3

  recovery:
    name: Recovery integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: proofstack_test
          POSTGRES_PASSWORD: proofstack_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proofstack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      PROOFSTACK_TEST_DATABASE_URL: postgresql://postgres:proofstack_test@127.0.0.1:5432/proofstack_test
      PROOFSTACK_TEST_POSTGRES_TOOL_IMAGE: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
      PROOFSTACK_TEST_S3_ACCESS_KEY_ID: proofstack-ci
      PROOFSTACK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      PROOFSTACK_TEST_S3_REGION: us-east-1
      PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY: proofstack-ci-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start pinned recovery object storage
        run: |
          docker run --detach --name proofstack-recovery-s3 \
            --env AWS_ACCESS_KEY_ID="$PROOFSTACK_TEST_S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY" \
            --publish 127.0.0.1:8333:8333 \
            chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b \
            mini -dir=/data -admin.ui=false -master.telemetry=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null "$PROOFSTACK_TEST_S3_ENDPOINT/"; then
              exit 0
            fi
            sleep 1
          done
          docker logs proofstack-recovery-s3
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run recovery integration tests
        run: pnpm test:integration:recovery

  s3:
    name: S3-compatible integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      PROOFSTACK_TEST_S3_ACCESS_KEY_ID: proofstack-ci
      PROOFSTACK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      PROOFSTACK_TEST_S3_REGION: us-east-1
      PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY: proofstack-ci-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start pinned S3-compatible storage
        run: |
          docker run --detach --name proofstack-s3 \
            --env AWS_ACCESS_KEY_ID="$PROOFSTACK_TEST_S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY" \
            --publish 127.0.0.1:8333:8333 \
            chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b \
            mini -dir=/data -admin.ui=false -master.telemetry=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null "$PROOFSTACK_TEST_S3_ENDPOINT/"; then
              exit 0
            fi
            sleep 1
          done
          docker logs proofstack-s3
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run S3-compatible integration tests
        run: pnpm test:integration:s3

  artifact-maintenance:
    name: Artifact lifecycle integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: proofstack_test
          POSTGRES_PASSWORD: proofstack_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proofstack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      PROOFSTACK_TEST_DATABASE_URL: postgresql://postgres:proofstack_test@127.0.0.1:5432/proofstack_test
      PROOFSTACK_TEST_S3_ACCESS_KEY_ID: proofstack-ci
      PROOFSTACK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      PROOFSTACK_TEST_S3_REGION: us-east-1
      PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY: proofstack-ci-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start pinned S3-compatible storage
        run: |
          docker run --detach --name proofstack-artifact-s3 \
            --env AWS_ACCESS_KEY_ID="$PROOFSTACK_TEST_S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$PROOFSTACK_TEST_S3_SECRET_ACCESS_KEY" \
            --publish 127.0.0.1:8333:8333 \
            chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b \
            mini -dir=/data -admin.ui=false -master.telemetry=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null "$PROOFSTACK_TEST_S3_ENDPOINT/"; then
              exit 0
            fi
            sleep 1
          done
          docker logs proofstack-artifact-s3
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run artifact lifecycle integration tests
        run: pnpm test:integration:artifacts

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan committed content
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
