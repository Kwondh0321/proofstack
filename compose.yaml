name: proofstack

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      PGTZ: UTC
      POSTGRES_DB: proofstack
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C
      POSTGRES_PASSWORD: proofstack-local-admin
      POSTGRES_USER: postgres
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    init: true
    ports:
      - "127.0.0.1:${PROOFSTACK_POSTGRES_PORT:-5432}:5432"
    stop_grace_period: 30s
    volumes:
      - proofstack_postgres_data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b
    profiles: [object-storage]
    command:
      - mini
      - -dir=/data
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: proofstack-local
      AWS_SECRET_ACCESS_KEY: proofstack-local-secret
      S3_BUCKET: proofstack-local-bootstrap
      TZ: UTC
    healthcheck:
      test:
        ["CMD", "curl", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    init: true
    ports:
      - "127.0.0.1:${PROOFSTACK_S3_PORT:-8333}:8333"
    stop_grace_period: 30s
    volumes:
      - proofstack_seaweedfs_data:/data

volumes:
  proofstack_postgres_data:
  proofstack_seaweedfs_data:
