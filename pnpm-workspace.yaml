packages:
  - "apps/*"
  - "examples/*"
  - "packages/*"
  - "sdks/*"
  - "services/*"

allowBuilds:
  # Required by tsx and Vite/Vitest. The exact version remains lockfile-pinned.
  esbuild: true

catalog:
  "@aws-sdk/client-s3": 3.1153.0
  "@smithy/node-http-handler": 4.12.1
  "@types/node": 24.19.2
  "@types/pg": 8.23.1
  "@vitest/coverage-v8": 4.1.12
  "pg": 8.23.1
  "protobufjs": 8.8.1
  "typescript": 6.0.3
  "vitest": 4.1.12
  "zod": 4.6.7

overrides:
  # GHSA-rxp7-6hxx-x8q5: preserve the rate-limit plugin's compatible 10.x range.
  # Reinspect this edge when advancing the rate-limit plugin.
  "@fastify/rate-limit@11.2.0>ip-address": 10.7.4
  # Keep this compatible development-only edge off the disclosed vulnerable Vite versions.
  # Reinspect this exact parent pin when advancing the Vitest catalog.
  "vitest@4.1.12>vite": 8.2.4

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - 'typescript@6.0.3'
  - '@types/node@24.13.3'
  - '@biomejs/biome@2.5.11'
  - '@biomejs/cli-darwin-arm64@2.5.11'
  - '@biomejs/cli-darwin-x64@2.5.11'
  - '@biomejs/cli-linux-arm64-musl@2.5.11'
  - '@biomejs/cli-linux-arm64@2.5.11'
  - '@biomejs/cli-linux-x64-musl@2.5.11'
  - '@biomejs/cli-linux-x64@2.5.11'
  - '@biomejs/cli-win32-arm64@2.5.11'
  - '@biomejs/cli-win32-x64@2.5.11'
